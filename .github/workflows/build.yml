name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Chave de assinatura (sempre a mesma, para atualizar sem perder dados)
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 20000 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add debug.keystore
            git commit -m "Chave de assinatura do app"
            git push
          fi
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Montar projeto Android
        run: |
          mkdir -p www
          cp index.html www/index.html
          echo '{"name":"plano-ogmo","version":"1.0.0","private":true}' > package.json
          npm install @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7 @capacitor/local-notifications@^7
          echo '{"appId":"br.app.planoogmo","appName":"Plano OGMO","webDir":"www"}' > capacitor.config.json
          npx cap add android
          npx cap sync android
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Icone
        continue-on-error: true
        run: |
          sudo apt-get install -y librsvg2-bin >/dev/null
          cat > icon.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <rect width="512" height="512" fill="#0f2e4a"/>
            <circle cx="256" cy="256" r="150" fill="none" stroke="#24476a" stroke-width="44"/>
            <path d="M256 106 A150 150 0 1 1 115 205" fill="none" stroke="#f28c28" stroke-width="44" stroke-linecap="round"/>
            <path d="M190 262 l46 46 l90 -98" fill="none" stroke="#ffffff" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          EOF
          RES=android/app/src/main/res
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; s=${pair##*:}
            rsvg-convert -w $s -h $s icon.svg -o $RES/mipmap-$d/ic_launcher.png
            cp $RES/mipmap-$d/ic_launcher.png $RES/mipmap-$d/ic_launcher_round.png
          done
          rm -rf $RES/mipmap-anydpi-v26

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../PlanoOGMO.apk

      - name: Publicar para baixar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Plano OGMO 1.${{ github.run_number }}
          body: Baixe o arquivo PlanoOGMO.apk abaixo e instale no celular Android.
          files: PlanoOGMO.apk
          make_latest: true
